<!DOCTYPE html>
<html lang="en">
<head>
<title>Create account | Nuvora SMS</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header><div class="wrap">
<a class="brand" href="index.html"><img src="logo-mark.svg" alt="" width="34" height="34">Nuvora <span>SMS</span></a>
<nav><a href="login.html">Sign in</a><a class="btn" href="register.html">Create account</a></nav>
</div></header>
<main id="main"><div class="wrap doc">
<h1>Create your account</h1>
<form id="auth-form" class="form" data-mode="register" novalidate>
<label for="email">Email address</label>
<input id="email" name="email" type="email" autocomplete="email" required>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
<button class="btn" type="submit">Create account</button>
<p id="msg" class="msg" role="status" aria-live="polite"></p>
</form>
<p>Already registered? <a href="login.html">Sign in</a>. By continuing you accept the <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a>.</p>
</div></main>
<footer><div class="wrap">
<div>&copy; <span id="year">2026</span> Nuvora Tech. Nuvora SMS is a service of Nuvora Tech.</div>
<div><a href="privacy.html">Privacy Policy</a> &nbsp; <a href="terms.html">Terms of Service</a></div>
</div></footer>
<script src="main.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="auth.js"></script>
</body>
</html>
