<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MelStream Auto</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #090b12;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 35px 20px;
    text-align: center;
}

.logo {
    font-size: 32px;
    font-weight: bold;
    color: #55d6ff;
    margin-top: 50px;
}

.subtitle {
    color: #a8adbb;
    margin-bottom: 35px;
}

.status {
    background: #171b27;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 25px;
}

.provider {
    background: #171b27;
    border: 1px solid #292f40;
    border-radius: 12px;
    padding: 20px;
    margin: 15px 0;
    text-align: left;
}

.provider h3 {
    margin: 0 0 8px;
    color: #55d6ff;
}

.provider p {
    color: #a8adbb;
    font-size: 13px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #55d6ff;
    color: #090b12;
    font-weight: bold;
    font-size: 15px;
}

.footer {
    margin-top: 40px;
    color: #777;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">MELSTREAM</div>

    <p class="subtitle">
        Unified Streaming Integration
    </p>

    <div class="status">
        <strong>MelStream Auto</strong>
        <p>Three streaming providers available</p>
    </div>

    <div class="provider">
        <h3>VidSrc</h3>
        <p>Primary streaming provider</p>
        <button onclick="openProvider('vidsrc')">
            Open VidSrc
        </button>
    </div>

    <div class="provider">
        <h3>SmashyStream</h3>
        <p>Secondary streaming provider</p>
        <button onclick="openProvider('smashy')">
            Open SmashyStream
        </button>
    </div>

    <div class="provider">
        <h3>VidFast</h3>
        <p>Third streaming provider</p>
        <button onclick="openProvider('vidfast')">
            Open VidFast
        </button>
    </div>

    <div class="footer">
        MELSTREAM AUTO © 2026
    </div>

</div>

<script>
function openProvider(provider) {

    const sources = {
        vidsrc: "https://vidsrc.sh/",
        smashy: "https://smashystream.xyz/",
        vidfast: "https://vidfast.vc/"
    };

    if (sources[provider]) {
        window.location.href = sources[provider];
    }
}
</script>

</body>
</html>
