<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MelStream</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090d16;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 25px;
}

.container {
  max-width: 850px;
  margin: auto;
}

h1 {
  color: #55aaff;
  font-size: 32px;
}

#status {
  color: #aaa;
  margin: 20px 0;
}

.player {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #151d2b;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 25px;
  overflow: hidden;
}

iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

button {
  background: #1685ff;
  border: none;
  color: white;
  padding: 13px 20px;
  border-radius: 8px;
  margin: 8px;
  font-size: 15px;
}

.note {
  color: #888;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

<h1>MelStream Auto</h1>

<p id="status">Preparing your stream...</p>

<div class="player" id="player">
  <p>Waiting for an authorized streaming source.</p>
</div>

<p class="note">
MelStream Auto · Unified Streaming Interface
</p>

</div>

<script>
const params = new URLSearchParams(window.location.search);

const type = params.get("type") || "movie";
const id = params.get("id");
const season = params.get("season");
const episode = params.get("episode");

const status = document.getElementById("status");

if (!id) {
  status.textContent = "No movie or TV ID received.";
} else {
  status.textContent =
    `Ready: ${type.toUpperCase()} · ID: ${id}` +
    (season ? ` · Season ${season}` : "") +
    (episode ? ` · Episode ${episode}` : "");
}
</script>

</body>
</html>
