<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MelStream Auto</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #080d18;
  color: white;
  font-family: Arial, sans-serif;
}
.container {
  max-width: 900px;
  margin: auto;
  padding: 25px;
  text-align: center;
}
h1 {
  color: #55aaff;
  font-size: 32px;
}
.info {
  background: #151e2d;
  padding: 18px;
  border-radius: 12px;
  margin: 20px 0;
  text-align: left;
}
.info p {
  margin: 9px 0;
  overflow-wrap: anywhere;
}
.player {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  margin-top: 20px;
}
iframe {
  width: 100%;
  height: 100%;
  border: 0;
}
.status {
  color: #55d69e;
  margin: 15px;
}
.footer {
  color: #77849a;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>
<body>
<div class="container">
<h1>MelStream Auto</h1>
<p>VidSrc Streaming Integration</p>
<div class="info">
  <p><strong>Connection:</strong> <span id="connection">Checking...</span></p>
  <p><strong>Content Type:</strong> <span id="type">—</span></p>
  <p><strong>Content ID:</strong> <span id="id">—</span></p>
</div>
<div class="status" id="status">Preparing player...</div>
<div class="player" id="player"></div>
<div class="footer">
MelStream Auto · Protected Interface
</div>
</div>
<script>
"use strict";
// Block pop-up windows opened by this page.
window.open = function() {
  return null;
};
// Block navigation attempts by the parent page.
try {
  if (window.top !== window.self) {
    // Keep the embedded player inside its parent.
  }
} catch (e) {
  // Cross-origin access is restricted.
}
const params = new URLSearchParams(window.location.search);
const type = params.get("type") || "";
const id = params.get("id") || "";
document.getElementById("connection").textContent =
  id ? "Parameters received" : "Waiting for parameters";
document.getElementById("type").textContent = type || "Not received";
document.getElementById("id").textContent = id || "Not received";
const validType = ["movie", "tv"].includes(type.toLowerCase());
const validId = /^[a-zA-Z0-9_-]+$/.test(id);
if (id && validType && validId) {
  const embedUrl =
    "https://vidsrc.sh/embed/" +
    encodeURIComponent(type) + "/" +
    encodeURIComponent(id);
  document.getElementById("status").textContent =
    "Loading VidSrc player...";
  const iframe = document.createElement("iframe");
  iframe.src = embedUrl;
  iframe.allowFullscreen = true;
  iframe.allow = "autoplay; fullscreen; picture-in-picture";
  iframe.referrerPolicy = "strict-origin-when-cross-origin";
  document.getElementById("player").appendChild(iframe);
  iframe.onload = function() {
    document.getElementById("status").textContent =
      "Player loaded. Enjoy watching.";
  };
  iframe.onerror = function() {
    document.getElementById("status").textContent =
      "The player could not be loaded.";
  };
} else {
  document.getElementById("status").textContent =
    "A valid movie or TV ID is required.";
}
</script>
</body>
</html>
