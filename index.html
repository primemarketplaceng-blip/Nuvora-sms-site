<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MelStream Auto</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080d18;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 25px;
  text-align: center;
}

h1 {
  color: #55aaff;
  font-size: 32px;
}

.info {
  background: #151e2d;
  padding: 18px;
  border-radius: 12px;
  margin: 20px 0;
  text-align: left;
}

.info p {
  margin: 9px 0;
  overflow-wrap: anywhere;
}

.player {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  margin-top: 20px;
}

iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

.status {
  color: #55d69e;
  margin: 15px;
}

.footer {
  color: #77849a;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

<h1>MelStream Auto</h1>
<p>VidSrc Streaming Integration</p>

<div class="info">
  <p><strong>Connection:</strong> <span id="connection">Checking...</span></p>
  <p><strong>Content Type:</strong> <span id="type">—</span></p>
  <p><strong>Content ID:</strong> <span id="id">—</span></p>
  <p><strong>Season:</strong> <span id="season">—</span></p>
  <p><strong>Episode:</strong> <span id="episode">—</span></p>
</div>

<div class="status" id="status">
Preparing player...
</div>

<div class="player" id="player">
</div>

<div class="footer">
MelStream Auto · VidSrc
</div>

</div>

<script>
const params = new URLSearchParams(window.location.search);

const type = params.get("type") || "";
const id = params.get("id") || "";
const season = params.get("season") || "";
const episode = params.get("episode") || "";

document.getElementById("connection").textContent =
  id ? "Parameters received" : "Waiting for parameters";

document.getElementById("type").textContent = type || "Not received";
document.getElementById("id").textContent = id || "Not received";
document.getElementById("season").textContent = season || "—";
document.getElementById("episode").textContent = episode || "—";

const validType = ["movie", "tv"].includes(type.toLowerCase());
const validId = /^[a-zA-Z0-9_-]+$/.test(id);

if (id && validType && validId) {

  const embedUrl =
    "https://vidsrc.sh/embed/" +
    encodeURIComponent(type) + "/" +
    encodeURIComponent(id);

  document.getElementById("status").textContent =
    "Opening VidSrc. Availability depends on the provider.";

  const iframe = document.createElement("iframe");

  iframe.src = embedUrl;
  iframe.allowFullscreen = true;
  iframe.allow = "autoplay; fullscreen; picture-in-picture";

  document.getElementById("player").appendChild(iframe);

} else {

  document.getElementById("status").textContent =
    "A valid movie or TV content ID is required.";

}
</script>

</body>
</html>
