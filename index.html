<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MelStream Auto</title>
  <style>
    body {
      margin: 0;
      background: #090909;
      color: white;
      font-family: Arial, sans-serif;
    }
    #player {
      width: 100%;
      height: 100vh;
      border: 0;
      background: #090909;
    }
    #status {
      text-align: center;
      padding: 25px;
    }
  </style>
</head>
<body>
  <div id="status">MelStream Auto is loading...</div>
  <iframe id="player" allowfullscreen
    allow="autoplay; fullscreen; encrypted-media"
    style="display:none"></iframe>

  <script>
    const params = new URLSearchParams(location.search);
    const type = params.get("type");
    const id = params.get("id");

    const status = document.getElementById("status");
    const player = document.getElementById("player");

    if (
      !["movie", "tv"].includes(type) ||
      !id ||
      !/^tt\d+/.test(id)
    ) {
      status.textContent = "Invalid movie or episode request.";
    } else {
      player.src =
        `https://vidsrc.sh/embed/${type}/${encodeURIComponent(id)}`;

      player.style.display = "block";
      status.style.display = "none";
    }
  </script>
</body>
</html>
