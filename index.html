<script>
"use strict";

const params = new URLSearchParams(window.location.search);

const type = params.get("type") || "";
const id = params.get("id") || "";

const title = document.getElementById("title");
const mediaType = document.getElementById("media-type");
const mediaId = document.getElementById("media-id");
const message = document.getElementById("message");

function initialize() {

  if (!id || id.includes("{")) {
    message.textContent =
      "No media ID received from MerlMovie.";
    return;
  }

  if (!["movie", "tv", "series"].includes(type)) {
    message.textContent =
      "Unsupported media type: " + type;
    return;
  }

  if (!/^[a-zA-Z0-9:_-]+$/.test(id)) {
    message.textContent =
      "Invalid media identifier.";
    return;
  }

  title.textContent = "MelStream Auto";

  mediaType.textContent =
    type === "movie"
      ? "Movie playback request"
      : "TV series playback request";

  mediaId.textContent = "Media ID: " + id;

  message.textContent =
    "Media identified successfully. Waiting for playback source.";
}

initialize();
</script>
